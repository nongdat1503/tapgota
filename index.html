<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Game Học Tiếng Anh Thực Chiến - Typing Shooter</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
        }

        #gameCanvas {
            border: 2px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            background: #020617;
            display: block;
        }

        .info {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            z-index: 5;
            pointer-events: none;
        }

        .info button {
            pointer-events: auto;
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .info button:hover {
            background: #0369a1;
        }

        /* Menu chọn chủ đề overlay */
        #menuOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
        }

        #menuOverlay h1 {
            color: #38bdf8;
            margin: 0 0 5px 0;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #menuOverlay p {
            color: #94a3b8;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 95%;
            max-width: 700px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .category-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
            text-align: center;
        }

        .category-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .category-btn.sentence-btn {
            grid-column: span 3;
            background: #059669;
            border-color: #34d399;
            font-size: 16px;
        }

        .category-btn.sentence-btn:hover {
            background: #10b981;
            color: white;
        }

        .category-btn.all-btn {
            grid-column: span 3;
            background: #0284c7;
            border-color: #38bdf8;
        }

        .category-btn.all-btn:hover {
            background: #0369a1;
            color: white;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="info">
        <div>Điểm: <span id="score" style="color: #4ade80; font-weight: bold;">0</span></div>
        <div>Chủ đề: <span id="currentCategory" style="color: #fde047;">Chưa chọn</span></div>
        <button id="changeCatBtn" onclick="showMenu()">Đổi chủ đề</button>
    </div>

    <!-- Màn hình chọn chủ đề -->
    <div id="menuOverlay">
        <h1>Bắn Từ Vựng & Cụm Câu (Gợi Ý Xáo Trộn)</h1>
        <p>Nhìn Tiếng Việt ---- Dựa vào ký tự/từ gợi ý xáo trộn ---- Gõ Tiếng Anh chuẩn xác!</p>
        <div class="category-grid" id="categoryGrid"></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
// Danh sách câu mẫu
const sentenceList = [
    { vi: "Xin chào, tôi tên là Long.", ans: ["Hello, my name is Long."] },
    { vi: "Rất vui được gặp bạn.", ans: ["It is nice to meet you.", "Nice to meet you."] },
    { vi: "Chào buổi sáng, mọi người.", ans: ["Good morning, everyone."] },
    { vi: "Bạn khỏe không?", ans: ["How are you?"] },
    { vi: "Tôi khỏe, cảm ơn.", ans: ["I am fine, thanks.", "Fine, thanks."] },
    { vi: "Tên bạn là gì?", ans: ["What is your name?"] },
    { vi: "Tôi đến từ Việt Nam.", ans: ["I am from Vietnam."] },
    { vi: "Bạn đến từ đâu?", ans: ["Where are you from?"] },
    { vi: "Tôi là một sinh viên.", ans: ["I am a student."] },
    { vi: "Tạm biệt, gặp lại bạn sau.", ans: ["Goodbye, see you later."] },
    { vi: "Chúc một ngày tốt lành.", ans: ["Have a nice day."] },
    { vi: "Bạn bao nhiêu tuổi?", ans: ["How old are you?"] },
    { vi: "Tôi 20 tuổi.", ans: ["I am twenty years old."] },
    { vi: "Đây là bạn của tôi, Nam.", ans: ["This is my friend, Nam."] },
    { vi: "Rất hân hạnh được gặp bạn.", ans: ["I am pleased to meet you."] },
    { vi: "Cảm ơn bạn rất nhiều.", ans: ["Thank you so much."] },
    { vi: "Không có gì.", ans: ["You are welcome."] },
    { vi: "Xin lỗi, tôi đến trễ.", ans: ["I am sorry for being late."] },
    { vi: "Chúc ngủ ngon.", ans: ["Good night."] },
    { vi: "Bạn sống ở đâu?", ans: ["Where do you live?"] },
    { vi: "Tôi sống ở Hà Nội.", ans: ["I live in Hanoi."] },
    { vi: "Công việc của bạn là gì?", ans: ["What is your job?"] },
    { vi: "Tôi là một giáo viên.", ans: ["I am a teacher."] },
    { vi: "Hôm nay bạn thế nào?", ans: ["How are you doing today?"] },
    { vi: "Tôi rất khỏe.", ans: ["I am doing great."] },
    { vi: "Còn bạn thì sao?", ans: ["How about you?"] },
    { vi: "Rất vui được biết bạn.", ans: ["Good to know you."] },
    { vi: "Hẹn gặp lại bạn vào ngày mai.", ans: ["See you tomorrow."] },
    { vi: "Xin lỗi vì đã làm phiền bạn.", ans: ["Sorry to bother you."] },
    { vi: "Hãy giữ liên lạc nhé.", ans: ["Keep in touch."] },
    { vi: "Số điện thoại của bạn là gì?", ans: ["What is your phone number?"] },
    { vi: "Email của bạn là gì?", ans: ["What is your email address?"] },
    { vi: "Tôi có thể giúp gì cho bạn?", ans: ["How can I help you?"] },
    { vi: "Tôi không sao.", ans: ["I am okay."] },
    { vi: "Chúc bạn may mắn.", ans: ["Good luck."] },
    { vi: "Chào buổi chiều.", ans: ["Good afternoon."] },
    { vi: "Chào buổi tối.", ans: ["Good evening."] },
    { vi: "Rất lâu rồi không gặp.", ans: ["Long time no see."] },
    { vi: "Dạo này bạn thế nào?", ans: ["How have you been?"] },
    { vi: "Mọi thứ vẫn tốt.", ans: ["Everything is good."] },
    { vi: "Tôi phải đi bây giờ.", ans: ["I have to go now."] },
    { vi: "Bảo trọng nhé.", ans: ["Take care."] },
    { vi: "Chào mừng bạn đến Việt Nam.", ans: ["Welcome to Vietnam."] },
    { vi: "Bạn có nói tiếng Anh không?", ans: ["Do you speak English?"] },
    { vi: "Tôi làm việc trong một công ty.", ans: ["I work in a company."] },
    { vi: "Tôi thích đọc sách.", ans: ["I like reading books."] },
    { vi: "Tôi thích nghe nhạc.", ans: ["I like listening to music."] },
    { vi: "Chúc bạn một cuối tuần vui vẻ.", ans: ["Have a nice weekend."] },
    { vi: "Cảm ơn vì sự giúp đỡ của bạn.", ans: ["Thanks for your help."] },
    { vi: "Tôi xin lỗi.", ans: ["I am so sorry."] }
];

const vocabularyCategories = {
    'Thực phẩm': [
        { en: 'apple', vi: 'Quả táo' }, { en: 'banana', vi: 'Quả chuối' }, { en: 'water', vi: 'Nước' },
        { en: 'food', vi: 'Thức ăn' }, { en: 'bread', vi: 'Bánh mì' }, { en: 'rice', vi: 'Cơm / Gạo' }
    ],
    'Công nghệ': [
        { en: 'computer', vi: 'Máy tính' }, { en: 'keyboard', vi: 'Bàn phím' }, { en: 'mouse', vi: 'Con chuột' },
        { en: 'screen', vi: 'Màn hình' }, { en: 'phone', vi: 'Điện thoại' }, { en: 'laptop', vi: 'Laptop' }
    ],
    'Gia đình & Con người': [
        { en: 'family', vi: 'Gia đình' }, { en: 'father', vi: 'Bố / Cha' }, { en: 'mother', vi: 'Mẹ' },
        { en: 'brother', vi: 'Anh / Em trai' }, { en: 'sister', vi: 'Chị / Em gái' }
    ]
};

let canvas, ctx, scoreEl, categoryEl, menuOverlay, categoryGrid;
let activeWordList = [];
let isSentenceMode = false;
let score = 0;
let enemies = [];
let bullets = [];
let activeTarget = null;
let gameRunning = false;
let spawnInterval = null;
let gun = { x: 400, y: 570 };

// Hàm tạo gợi ý xáo trộn ký tự từ hoặc xáo trộn từ trong câu
function generateScrambledHint(text, isSentence) {
    if (isSentence) {
        // Xáo trộn các TỪ trong CÂU
        let words = text.replace(/[.,?!]/g, '').split(' ');
        for (let i = words.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [words[i], words[j]] = [words[j], words[i]];
        }
        return words.join(' / ');
    } else {
        // Xáo trộn các KÝ TỰ trong TỪ (Ví dụ: laptop -> l a t o p p)
        let chars = text.toLowerCase().replace(/[^a-z0-9]/g, '').split('');
        
        // Thêm 1-2 ký tự ngẫu nhiên hoặc lặp lại để tạo thử thách nhẹ
        if (chars.length > 3) {
            const randomChar = chars[Math.floor(Math.random() * chars.length)];
            chars.push(randomChar);
        }

        // Xáo trộn mảng ký tự
        for (let i = chars.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [chars[i], chars[j]] = [chars[j], chars[i]];
        }
        return chars.join(' ');
    }
}

// Hàm phát âm tiếng Anh
function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    scoreEl = document.getElementById('score');
    categoryEl = document.getElementById('currentCategory');
    menuOverlay = document.getElementById('menuOverlay');
    categoryGrid = document.getElementById('categoryGrid');
    gun = { x: canvas.width / 2, y: canvas.height - 30 };

    initMenu();
    gameLoop();
});

function initMenu() {
    categoryGrid.innerHTML = '';
    
    // Nút Luyện Tập Đoạn Câu Tiếng Anh
    const sentenceBtn = document.createElement('button');
    sentenceBtn.className = 'category-btn sentence-btn';
    sentenceBtn.innerText = '💬 Luyện Tập Gõ Câu Giao Tiếp';
    sentenceBtn.onclick = () => startGame('Đoạn Câu Giao Tiếp', true);
    categoryGrid.appendChild(sentenceBtn);

    // Nút chọn tất cả từ vựng
    const allBtn = document.createElement('button');
    allBtn.className = 'category-btn all-btn';
    allBtn.innerText = '🌟 Tất cả từ vựng';
    allBtn.onclick = () => startGame('Tất cả từ vựng', false);
    categoryGrid.appendChild(allBtn);

    // Tạo nút cho từng chủ đề từ vựng
    Object.keys(vocabularyCategories).forEach(catName => {
        const btn = document.createElement('button');
        btn.className = 'category-btn';
        btn.innerText = 'Từ vựng: ' + catName;
        btn.onclick = () => startGame(catName, false);
        categoryGrid.appendChild(btn);
    });
}

function showMenu() {
    gameRunning = false;
    clearInterval(spawnInterval);
    enemies = [];
    bullets = [];
    activeTarget = null;
    menuOverlay.style.display = 'flex';
}

function startGame(category, isSentence = false) {
    categoryEl.innerText = category;
    isSentenceMode = isSentence;
    
    if (isSentenceMode) {
        activeWordList = sentenceList.map(item => ({
            en: item.ans[0],       
            vi: item.vi
        }));
    } else if (category === 'Tất cả từ vựng') {
        activeWordList = Object.values(vocabularyCategories).flat();
    } else {
        activeWordList = vocabularyCategories[category];
    }

    score = 0;
    scoreEl.innerText = score;
    enemies = [];
    bullets = [];
    activeTarget = null;
    
    menuOverlay.style.display = 'none';
    gameRunning = true;
    
    clearInterval(spawnInterval);
    const spawnTime = isSentenceMode ? 9000 : 3500;
    spawnInterval = setInterval(spawnEnemy, spawnTime);
    spawnEnemy();
}

function spawnEnemy() {
    if (!gameRunning || activeWordList.length === 0) return;

    const wordObj = activeWordList[Math.floor(Math.random() * activeWordList.length)];
    const x = Math.random() * (canvas.width - 380) + 40;

    const speed = isSentenceMode ? 0.12 : 0.4;

    // Tạo gợi ý xáo trộn động mỗi khi spawn
    const hintText = generateScrambledHint(wordObj.en, isSentenceMode);

    enemies.push({
        text: wordObj.en,
        meaning: wordObj.vi,
        hint: hintText,
        typedIndex: 0,
        x: x,
        y: 30,
        speed: speed,
        wrongFlash: 0
    });
}

function fireBullet(targetX, targetY) {
    bullets.push({
        x: gun.x,
        y: gun.y,
        targetX: targetX,
        targetY: targetY,
        speed: 18
    });
}

window.addEventListener('keydown', (e) => {
    if (!gameRunning) return;

    const key = e.key;
    if (key.length !== 1) return;

    const keyLower = key.toLowerCase();

    if (!activeTarget) {
        for (let enemy of enemies) {
            if (enemy.text[0].toLowerCase() === keyLower) {
                activeTarget = enemy;
                break;
            }
        }
    }

    if (activeTarget) {
        const expectedChar = activeTarget.text[activeTarget.typedIndex];
        
        if (expectedChar && expectedChar.toLowerCase() === keyLower) {
            activeTarget.typedIndex++;
            fireBullet(activeTarget.x + activeTarget.typedIndex * 9, activeTarget.y);

            if (activeTarget.typedIndex === activeTarget.text.length) {
                score += isSentenceMode ? 30 : 10;
                scoreEl.innerText = score;
                
                speakText(activeTarget.text);

                enemies = enemies.filter(e => e !== activeTarget);
                activeTarget = null;
            }
        } else {
            activeTarget.wrongFlash = 10;
        }
    }
});

function update() {
    if (!gameRunning) return;

    for (let enemy of enemies) {
        enemy.y += enemy.speed;
        if (enemy.wrongFlash > 0) enemy.wrongFlash--;

        if (enemy.y > canvas.height - 40) {
            if (enemy === activeTarget) activeTarget = null;
            enemies = enemies.filter(e => e !== enemy);
        }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        let dx = b.targetX - b.x;
        let dy = b.targetY - b.y;
        let dist = Math.hypot(dx, dy);

        if (dist < 12) {
            bullets.splice(i, 1);
        } else {
            b.x += (dx / dist) * b.speed;
            b.y += (dy / dist) * b.speed;
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameRunning) return;

    // Vẽ súng
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(gun.x, gun.y, 22, 0, Math.PI * 2);
    ctx.fill();

    // Vẽ kẻ địch / câu
    for (let enemy of enemies) {
        const isSelected = (enemy === activeTarget);

        // 1. Dòng Tiếng Việt (Nghĩa)
        ctx.font = 'bold 15px Arial';
        ctx.fillStyle = enemy.wrongFlash > 0 ? '#ef4444' : (isSelected ? '#fde047' : '#e2e8f0');
        ctx.fillText(`🇻🇳 ${enemy.meaning}`, enemy.x, enemy.y - 22);

        // 2. Dòng Gợi Ý Ký Tự / Từ Xáo Trộn
        ctx.font = 'italic 13px Arial';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(`[Gợi ý: ${enemy.hint}]`, enemy.x, enemy.y - 6);

        // 3. Dòng Tiếng Anh (ẨN CHỮ CHƯA GÕ - CHỈ HIỆN KÝ TỰ ĐÃ GÕ ĐÚNG)
        ctx.font = 'bold 18px Courier New';
        let typedPart = enemy.text.substring(0, enemy.typedIndex);
        
        // Chữ đã gõ đúng
        ctx.fillStyle = '#4ade80';
        ctx.fillText(typedPart, enemy.x, enemy.y + 16);

        // Chữ chưa gõ
        let typedWidth = ctx.measureText(typedPart).width;
        let remainingLength = enemy.text.length - enemy.typedIndex;
        let hiddenPlaceholder = " _".repeat(remainingLength);

        ctx.fillStyle = isSelected ? '#38bdf8' : '#475569';
        ctx.fillText(hiddenPlaceholder, enemy.x + typedWidth, enemy.y + 16);
    }

    // Vẽ đạn
    ctx.fillStyle = '#f43f5e';
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
