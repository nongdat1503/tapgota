<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Game Bắn Từ Vựng & Câu - Typing Shooter</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
        }

        #gameCanvas {
            border: 2px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            background: #020617;
            display: block;
        }

        .info {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            z-index: 5;
            pointer-events: none;
        }

        .info button {
            pointer-events: auto;
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .info button:hover {
            background: #0369a1;
        }

        /* Menu chọn chủ đề overlay */
        #menuOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
        }

        #menuOverlay h1 {
            color: #38bdf8;
            margin: 0 0 5px 0;
            font-size: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #menuOverlay p {
            color: #94a3b8;
            margin: 0 0 20px 0;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 95%;
            max-width: 700px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .category-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
            text-align: center;
        }

        .category-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .category-btn.sentence-btn {
            grid-column: span 3;
            background: #059669;
            border-color: #34d399;
            font-size: 16px;
        }

        .category-btn.sentence-btn:hover {
            background: #10b981;
            color: white;
        }

        .category-btn.all-btn {
            grid-column: span 3;
            background: #0284c7;
            border-color: #38bdf8;
        }

        .category-btn.all-btn:hover {
            background: #0369a1;
            color: white;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="info">
        <div>Điểm: <span id="score" style="color: #4ade80; font-weight: bold;">0</span></div>
        <div>Chủ đề: <span id="currentCategory" style="color: #fde047;">Chưa chọn</span></div>
        <button id="changeCatBtn" onclick="showMenu()">Đổi chủ đề</button>
    </div>

    <!-- Màn hình chọn chủ đề -->
    <div id="menuOverlay">
        <h1>Bắn Từ Vựng & Cụm Câu</h1>
        <p>Chọn một chủ đề hoặc chế độ luyện tập</p>
        <div class="category-grid" id="categoryGrid"></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

const vocabularyCategories = {
    'Thực phẩm': [
        { en: 'apple', vi: 'Quả táo' }, { en: 'banana', vi: 'Quả chuối' }, { en: 'water', vi: 'Nước' },
        { en: 'food', vi: 'Thức ăn' }, { en: 'bread', vi: 'Bánh mì' }, { en: 'rice', vi: 'Cơm / Gạo' }
    ],
    'Công nghệ': [
        { en: 'computer', vi: 'Máy tính' }, { en: 'keyboard', vi: 'Bàn phím' }, { en: 'mouse', vi: 'Con chuột' },
        { en: 'screen', vi: 'Màn hình' }, { en: 'phone', vi: 'Điện thoại' }, { en: 'laptop', vi: 'Laptop' }
    ],
    'Gia đình & Con người': [
        { en: 'family', vi: 'Gia đình' }, { en: 'father', vi: 'Bố / Cha' }, { en: 'mother', vi: 'Mẹ' },

    ]
};

let canvas, ctx, scoreEl, categoryEl, menuOverlay, categoryGrid;
let activeWordList = [];
let isSentenceMode = false;
let score = 0;
let enemies = [];
let bullets = [];
let activeTarget = null;
let gameRunning = false;
let spawnInterval = null;
let gun = { x: 400, y: 570 };

document.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    scoreEl = document.getElementById('score');
    categoryEl = document.getElementById('currentCategory');
    menuOverlay = document.getElementById('menuOverlay');
    categoryGrid = document.getElementById('categoryGrid');
    gun = { x: canvas.width / 2, y: canvas.height - 30 };

    initMenu();
    gameLoop();
});

function initMenu() {
    categoryGrid.innerHTML = '';
    
    // Nút Luyện Tập Đoạn Câu Tiếng Anh (Chế độ mới)
    const sentenceBtn = document.createElement('button');
    sentenceBtn.className = 'category-btn sentence-btn';
    sentenceBtn.innerText = '💬 Luyện Tập Gõ Đoạn/Câu Tiếng Anh (Tốc độ chậm)';
    sentenceBtn.onclick = () => startGame('Đoạn Câu Giao Tiếp', true);
    categoryGrid.appendChild(sentenceBtn);

    // Nút chọn tất cả từ vựng
    const allBtn = document.createElement('button');
    allBtn.className = 'category-btn all-btn';
    allBtn.innerText = '🌟 Tất cả từ vựng';
    allBtn.onclick = () => startGame('Tất cả từ vựng', false);
    categoryGrid.appendChild(allBtn);

    // Tạo nút cho từng chủ đề từ vựng
    Object.keys(vocabularyCategories).forEach(catName => {
        const btn = document.createElement('button');
        btn.className = 'category-btn';
        btn.innerText = 'Từ vựng: ' + catName;
        btn.onclick = () => startGame(catName, false);
        categoryGrid.appendChild(btn);
    });
}

function showMenu() {
    gameRunning = false;
    clearInterval(spawnInterval);
    enemies = [];
    bullets = [];
    activeTarget = null;
    menuOverlay.style.display = 'flex';
}

function startGame(category, isSentence = false) {
    categoryEl.innerText = category;
    isSentenceMode = isSentence;
    
    if (isSentenceMode) {
        // Chuẩn hóa dữ liệu câu để game xử lý như từ vựng
        activeWordList = sentenceList.map(item => ({
            en: item.ans[0],       // Câu hoàn chỉnh tiếng Anh
            vi: `${item.vi} [Gợi ý: ${item.words}]` // Nghĩa + các từ gợi ý
        }));
    } else if (category === 'Tất cả từ vựng') {
        activeWordList = Object.values(vocabularyCategories).flat();
    } else {
        activeWordList = vocabularyCategories[category];
    }

    score = 0;
    scoreEl.innerText = score;
    enemies = [];
    bullets = [];
    activeTarget = null;
    
    menuOverlay.style.display = 'none';
    gameRunning = true;
    
    clearInterval(spawnInterval);
    // Nếu là chế độ câu: Giảm tần suất xuất hiện câu xuống 7000ms (7 giây/câu)
    const spawnTime = isSentenceMode ? 7000 : 2500;
    spawnInterval = setInterval(spawnEnemy, spawnTime);
}

function spawnEnemy() {
    if (!gameRunning || activeWordList.length === 0) return;

    const wordObj = activeWordList[Math.floor(Math.random() * activeWordList.length)];
    const x = Math.random() * (canvas.width - 350) + 30;

    // Tốc độ di chuyển: Nếu gõ câu thì cho rơi cực chậm (0.15 - 0.25)
    const speed = isSentenceMode ? (0.15 + Math.random() * 0.1) : (0.8 + Math.random() * 0.5);

    enemies.push({
        text: wordObj.en,
        meaning: wordObj.vi,
        typedIndex: 0,
        x: x,
        y: 0,
        speed: speed
    });
}

function fireBullet(targetX, targetY) {
    bullets.push({
        x: gun.x,
        y: gun.y,
        targetX: targetX,
        targetY: targetY,
        speed: 16
    });
}

window.addEventListener('keydown', (e) => {
    if (!gameRunning) return;

    // Lấy ký tự nhập (cho phép gõ cả chữ cái, dấu cách ' ', dấu phẩy, hỏi chấm,...)
    const key = e.key;
    if (key.length !== 1) return; // Bỏ qua phím Shift, Enter, Backspace,...

    const keyLower = key.toLowerCase();

    // Tìm mục tiêu nếu chưa chọn
    if (!activeTarget) {
        for (let enemy of enemies) {
            if (enemy.text[0].toLowerCase() === keyLower) {
                activeTarget = enemy;
                break;
            }
        }
    }

    // Kiểm tra gõ đúng phím tiếp theo
    if (activeTarget) {
        const expectedChar = activeTarget.text[activeTarget.typedIndex];
        
        // So sánh không phân biệt hoa thường để dễ gõ hơn
        if (expectedChar && expectedChar.toLowerCase() === keyLower) {
            activeTarget.typedIndex++;
            fireBullet(activeTarget.x + activeTarget.typedIndex * 8, activeTarget.y);

            // Gõ xong toàn bộ từ/câu
            if (activeTarget.typedIndex === activeTarget.text.length) {
                score += isSentenceMode ? 30 : 10;
                scoreEl.innerText = score;
                enemies = enemies.filter(e => e !== activeTarget);
                activeTarget = null;
            }
        }
    }
});

function update() {
    if (!gameRunning) return;

    // Cập nhật vị trí câu/từ rơi xuống
    for (let enemy of enemies) {
        enemy.y += enemy.speed;
        if (enemy.y > canvas.height - 40) {
            if (enemy === activeTarget) activeTarget = null;
            enemies = enemies.filter(e => e !== enemy);
        }
    }

    // Cập nhật vị trí đạn bắn
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        let dx = b.targetX - b.x;
        let dy = b.targetY - b.y;
        let dist = Math.hypot(dx, dy);

        if (dist < 10) {
            bullets.splice(i, 1);
        } else {
            b.x += (dx / dist) * b.speed;
            b.y += (dy / dist) * b.speed;
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameRunning) return;

    // Vẽ pháo / súng
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(gun.x, gun.y, 20, 0, Math.PI * 2);
    ctx.fill();

    // Vẽ các đoạn câu / từ vựng rơi xuống
    for (let enemy of enemies) {
        // 1. Dòng nghĩa tiếng Việt & Gợi ý từ
        ctx.font = isSentenceMode ? '13px Arial' : '14px Arial';
        ctx.fillStyle = enemy === activeTarget ? '#fde047' : '#94a3b8';
        ctx.fillText(`(${enemy.meaning})`, enemy.x, enemy.y - 18);

        // 2. Dòng câu tiếng Anh cần gõ
        ctx.font = isSentenceMode ? '16px Courier New' : '22px Courier New';
        let typedPart = enemy.text.substring(0, enemy.typedIndex);
        let remainingPart = enemy.text.substring(enemy.typedIndex);

        // Phần chữ đã gõ đúng (Màu xanh lá)
        ctx.fillStyle = '#4ade80';
        ctx.fillText(typedPart, enemy.x, enemy.y);

        // Phần chữ còn lại chưa gõ (Màu vàng nếu đang chọn, màu trắng nếu chưa chọn)
        let typedWidth = ctx.measureText(typedPart).width;
        ctx.fillStyle = enemy === activeTarget ? '#facc15' : '#ffffff';
        ctx.fillText(remainingPart, enemy.x + typedWidth, enemy.y);
    }

    // Vẽ đạn
    ctx.fillStyle = '#f43f5e';
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
</script>
