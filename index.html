<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Game Học Tiếng Anh Thực Chiến - Typing Shooter</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
        }

        #gameCanvas {
            border: 2px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            background: #020617;
            display: block;
        }

        .info {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            z-index: 5;
            pointer-events: none;
        }

        .info button {
            pointer-events: auto;
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .info button:hover {
            background: #0369a1;
        }

        /* Overlay dùng chung */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.96);
            border: 2px solid #38bdf8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
        }

        .overlay h1 {
            color: #38bdf8;
            margin: 0 0 5px 0;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .overlay p {
            color: #94a3b8;
            margin: 0 0 15px 0;
            text-align: center;
        }

        /* Menu chủ đề */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 95%;
            max-width: 700px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .category-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
            text-align: center;
        }

        .category-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .category-btn.daily-btn {
            grid-column: span 3;
            background: #eab308;
            color: #0f172a;
            border-color: #fde047;
            font-size: 16px;
        }

        .category-btn.daily-btn:hover {
            background: #facc15;
            color: #0f172a;
        }

        .category-btn.sentence-btn {
            grid-column: span 3;
            background: #059669;
            border-color: #34d399;
            font-size: 15px;
        }

        .category-btn.sentence-btn:hover {
            background: #10b981;
            color: white;
        }

        .category-btn.all-btn {
            grid-column: span 3;
            background: #0284c7;
            border-color: #38bdf8;
        }

        /* Màn hình học từ mới */
        #learnOverlay {
            display: none;
            position: absolute;
        }

        /* Nút thoát ở màn hình học từ mới */
        .close-learn-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .close-learn-btn:hover {
            background: #dc2626;
        }

        .word-cards-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            max-height: 380px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 5px;
        }

        .word-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .word-card .word-info {
            display: flex;
            flex-direction: column;
        }

        .word-card .en {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
        }

        .word-card .phonetic {
            font-size: 12px;
            color: #fde047;
            margin: 2px 0;
        }

        .word-card .vi {
            font-size: 14px;
            color: #cbd5e1;
        }

        .audio-btn {
            background: #0284c7;
            border: none;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .start-play-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .start-play-btn:hover {
            background: #16a34a;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="info">
        <div>Điểm: <span id="score" style="color: #4ade80; font-weight: bold;">0</span></div>
        <div>Chủ đề: <span id="currentCategory" style="color: #fde047;">Chưa chọn</span></div>
        <button id="changeCatBtn" onclick="showMenu()">Đổi chủ đề</button>
    </div>

    <!-- Màn hình chọn chủ đề -->
    <div id="menuOverlay" class="overlay">
        <h1>Bắn Từ Vựng & Cụm Câu (Gợi Ý Xáo Trộn)</h1>
        <p>Nhìn Tiếng Việt ---- Dựa vào gợi ý xáo trộn ---- Gõ Tiếng Anh chuẩn xác!</p>
        <div class="category-grid" id="categoryGrid"></div>
    </div>

    <!-- Màn hình Học từ mới hôm nay -->
    <div id="learnOverlay" class="overlay">
        <button class="close-learn-btn" onclick="showMenu()">❌ Quay Lại</button>
        <h1 id="learnTitle">10 Từ Vựng Ngày Hôm Nay</h1>
        <p>Hãy cùng ghi nhớ và luyện phát âm trước khi tham gia thử thách nhé!</p>
        <div class="word-cards-container" id="wordCardsContainer"></div>
        <button class="start-play-btn" onclick="startDailyGame()">🚀 Bắt Đầu Chiến Đấu!</button>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
// Bộ từ vựng A1-A2
const fullVocabularyList = [
    { en: 'assignment', type: 'n', ipa: '/əˈsaɪn.mənt/', vi: 'bài tập tiểu luận', cat: 'Giáo dục' },
    { en: 'concentrate', type: 'v', ipa: '/ˈkɑːn.sən.treɪt/', vi: 'tập trung', cat: 'Giáo dục' },
    { en: 'curriculum', type: 'n', ipa: '/kəˈrɪk.jə.ləm/', vi: 'chương trình giảng dạy', cat: 'Giáo dục' },
    { en: 'graduate', type: 'v', ipa: '/ˈɡrædʒ.u.eɪt/', vi: 'tốt nghiệp', cat: 'Giáo dục' },
    { en: 'internship', type: 'n', ipa: '/ˈɪn.tɜːrn.ʃɪp/', vi: 'kỳ thực tập', cat: 'Giáo dục' },
    { en: 'practice', type: 'n', ipa: '/ˈpræk.tɪs/', vi: 'bài luyện tập', cat: 'Giáo dục' },
    { en: 'qualification', type: 'n', ipa: '/ˌkwɑː.lə.fəˈkeɪ.ʃən/', vi: 'trình độ chuyên môn', cat: 'Giáo dục' },
    { en: 'syllabus', type: 'n', ipa: '/ˈsɪl.ə.bəs/', vi: 'giáo trình', cat: 'Giáo dục' },
    { en: 'thesis', type: 'n', ipa: '/ˈθiː.sɪs/', vi: 'luận văn', cat: 'Giáo dục' },
    { en: 'tuition', type: 'n', ipa: '/tuːˈɪʃ.ən/', vi: 'học phí, giảng dạy', cat: 'Giáo dục' },
    { en: 'atmosphere', type: 'n', ipa: '/ˈæt.mə.sfɪr/', vi: 'khí quyển', cat: 'Thiên nhiên' },
    { en: 'environment', type: 'n', ipa: '/ɪnˈvaɪ.rən.mənt/', vi: 'môi trường', cat: 'Thiên nhiên' },
    { en: 'mountain', type: 'n', ipa: '/ˈmaʊn.tən/', vi: 'núi, dãy núi', cat: 'Thiên nhiên' },
    { en: 'waterfall', type: 'n', ipa: '/ˈwɑː.t̬ɚ.fɑːl/', vi: 'thác nước', cat: 'Thiên nhiên' },
    { en: 'volcano', type: 'n', ipa: '/vɑːlˈkeɪ.noʊ/', vi: 'núi lửa', cat: 'Thiên nhiên' },
    { en: 'ambitious', type: 'adj', ipa: '/æmˈbɪʃ.əs/', vi: 'tham vọng', cat: 'Tính cách' },
    { en: 'courageous', type: 'adj', ipa: '/kəˈreɪ.dʒəs/', vi: 'can đảm', cat: 'Tính cách' },
    { en: 'diligent', type: 'adj', ipa: '/ˈdɪl.ə.dʒənt/', vi: 'siêng năng, cần cù', cat: 'Tính cách' },
    { en: 'honest', type: 'adj', ipa: '/ˈɑː.nɪst/', vi: 'chân thật, trung thực', cat: 'Tính cách' },
    { en: 'croissant', type: 'n', ipa: '/kwɑːˈsɑːŋ/', vi: 'bánh sừng bò', cat: 'Thực phẩm' },
    { en: 'hamburger', type: 'n', ipa: '/ˈhæmˌbɝː.ɡɚ/', vi: 'bánh kẹp thịt', cat: 'Thực phẩm' },
    { en: 'accountant', type: 'n', ipa: '/əˈkaʊn.tənt/', vi: 'kế toán', cat: 'Nghề nghiệp' },
    { en: 'pharmacist', type: 'n', ipa: '/ˈfɑːr.mə.sɪst/', vi: 'dược sĩ', cat: 'Nghề nghiệp' },
    { en: 'programmer', type: 'n', ipa: '/ˈproʊ.ɡræm.ɚ/', vi: 'lập trình viên', cat: 'Nghề nghiệp' }
];

// Danh sách câu mẫu hỗ trợ nhiều CÂU ĐỒNG NGHĨA
const sentenceList = [
    { vi: "Xin chào, tôi tên là Long.", ans: ["Hello, my name is Long.", "Hi, my name is Long.", "Hello, I am Long."] },
    { vi: "Rất vui được gặp bạn.", ans: ["Nice to meet you.", "It is nice to meet you.", "Pleased to meet you."] },
    { vi: "Chào buổi sáng, mọi người.", ans: ["Good morning, everyone.", "Good morning everyone."] },
    { vi: "Bạn khỏe không?", ans: ["How are you?", "How are you doing?"] },
    { vi: "Tôi khỏe, cảm ơn.", ans: ["I am fine, thanks.", "I am good, thanks.", "Fine, thanks."] },
    { vi: "Tên bạn là gì?", ans: ["What is your name?", "What's your name?"] },
    { vi: "Tôi đến từ Việt Nam.", ans: ["I am from Vietnam.", "I come from Vietnam."] },
    { vi: "Chúc một ngày tốt lành.", ans: ["Have a nice day.", "Have a good day."] },
    { vi: "Cảm ơn bạn rất nhiều.", ans: ["Thank you so much.", "Thanks a lot.", "Thank you very much."] },
    { vi: "Bạn có nói tiếng Anh không?", ans: ["Do you speak English?"] }
];

let canvas, ctx, scoreEl, categoryEl, menuOverlay, learnOverlay, categoryGrid, wordCardsContainer;
let activeWordList = [];
let todayDailyWords = [];
let isSentenceMode = false;
let score = 0;
let enemies = [];
let bullets = [];
let activeTarget = null;
let gameRunning = false;
let spawnInterval = null;
let gun = { x: 400, y: 570 };

// Lấy 10 từ vựng theo ngày
function getDailyWords() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const diff = now - start;
    const oneDay = 1000 * 60 * 60 * 24;
    const dayOfYear = Math.floor(diff / oneDay);

    const totalWords = fullVocabularyList.length;
    const dailyCount = 10;
    const startIndex = (dayOfYear * dailyCount) % totalWords;
    
    let dailyWords = [];
    for (let i = 0; i < dailyCount; i++) {
        dailyWords.push(fullVocabularyList[(startIndex + i) % totalWords]);
    }
    return dailyWords;
}

// Xáo trộn gợi ý
function generateScrambledHint(text, isSentence) {
    if (isSentence) {
        let words = text.replace(/[.,?!]/g, '').split(' ');
        for (let i = words.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [words[i], words[j]] = [words[j], words[i]];
        }
        return words.join(' / ');
    } else {
        let chars = text.toLowerCase().replace(/[^a-z0-9]/g, '').split('');
        for (let i = chars.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [chars[i], chars[j]] = [chars[j], chars[i]];
        }
        return chars.join(' ');
    }
}

// Phát âm
function speakText(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    scoreEl = document.getElementById('score');
    categoryEl = document.getElementById('currentCategory');
    menuOverlay = document.getElementById('menuOverlay');
    learnOverlay = document.getElementById('learnOverlay');
    categoryGrid = document.getElementById('categoryGrid');
    wordCardsContainer = document.getElementById('wordCardsContainer');
    gun = { x: canvas.width / 2, y: canvas.height - 30 };

    initMenu();
    gameLoop();
});

function initMenu() {
    categoryGrid.innerHTML = '';
    
    const dailyBtn = document.createElement('button');
    dailyBtn.className = 'category-btn daily-btn';
    dailyBtn.innerText = '📅 Học 10 Từ Vựng Mới Hôm Nay';
    dailyBtn.onclick = showDailyLearnScreen;
    categoryGrid.appendChild(dailyBtn);

    const sentenceBtn = document.createElement('button');
    sentenceBtn.className = 'category-btn sentence-btn';
    sentenceBtn.innerText = '💬 Luyện Tập Gõ Câu Giao Tiếp';
    sentenceBtn.onclick = () => startGame('Đoạn Câu Giao Tiếp', true);
    categoryGrid.appendChild(sentenceBtn);

    const allBtn = document.createElement('button');
    allBtn.className = 'category-btn all-btn';
    allBtn.innerText = '🌟 Ôn Tập Tất Cả Từ Vựng';
    allBtn.onclick = () => startGame('Tất cả từ vựng', false);
    categoryGrid.appendChild(allBtn);

    const categories = [...new Set(fullVocabularyList.map(item => item.cat))];
    categories.forEach(catName => {
        const btn = document.createElement('button');
        btn.className = 'category-btn';
        btn.innerText = 'Chủ đề: ' + catName;
        btn.onclick = () => startGame(catName, false);
        categoryGrid.appendChild(btn);
    });
}

function showDailyLearnScreen() {
    todayDailyWords = getDailyWords();
    wordCardsContainer.innerHTML = '';

    todayDailyWords.forEach(w => {
        const card = document.createElement('div');
        card.className = 'word-card';
        card.innerHTML = `
            <div class="word-info">
                <span class="en">${w.en} <small style="font-size:12px; color:#94a3b8;">(${w.type})</small></span>
                <span class="phonetic">${w.ipa}</span>
                <span class="vi">${w.vi}</span>
            </div>
            <button class="audio-btn" onclick="speakText('${w.en}')">🔊</button>
        `;
        wordCardsContainer.appendChild(card);
    });

    menuOverlay.style.display = 'none';
    learnOverlay.style.display = 'flex';
}

function startDailyGame() {
    learnOverlay.style.display = 'none';
    activeWordList = todayDailyWords;
    startGame('10 Từ Hôm Nay', false, true);
}

function showMenu() {
    gameRunning = false;
    clearInterval(spawnInterval);
    enemies = [];
    bullets = [];
    activeTarget = null;
    learnOverlay.style.display = 'none';
    menuOverlay.style.display = 'flex';
}

function startGame(category, isSentence = false, isPreloaded = false) {
    categoryEl.innerText = category;
    isSentenceMode = isSentence;
    
    if (!isPreloaded) {
        if (isSentenceMode) {
            activeWordList = sentenceList.map(item => ({ 
                validAnswers: item.ans,
                vi: item.vi 
            }));
        } else if (category === 'Tất cả từ vựng') {
            activeWordList = fullVocabularyList.map(item => ({ validAnswers: [item.en], vi: item.vi }));
        } else {
            activeWordList = fullVocabularyList.filter(item => item.cat === category).map(item => ({ validAnswers: [item.en], vi: item.vi }));
        }
    } else {
        activeWordList = activeWordList.map(item => ({ validAnswers: [item.en], vi: item.vi }));
    }

    score = 0;
    scoreEl.innerText = score;
    enemies = [];
    bullets = [];
    activeTarget = null;
    
    menuOverlay.style.display = 'none';
    learnOverlay.style.display = 'none';
    gameRunning = true;
    
    clearInterval(spawnInterval);
    const spawnTime = isSentenceMode ? 9000 : 3500;
    spawnInterval = setInterval(spawnEnemy, spawnTime);
    spawnEnemy();
}

function spawnEnemy() {
    if (!gameRunning || activeWordList.length === 0) return;

    const wordObj = activeWordList[Math.floor(Math.random() * activeWordList.length)];
    const x = Math.random() * (canvas.width - 380) + 40;
    const speed = isSentenceMode ? 0.12 : 0.4;
    
    const primaryText = wordObj.validAnswers[0];
    const hintText = generateScrambledHint(primaryText, isSentenceMode);

    enemies.push({
        validAnswers: wordObj.validAnswers,
        currentMatchedAns: null,
        meaning: wordObj.vi,
        hint: hintText,
        userTyped: "",
        x: x,
        y: 30,
        speed: speed,
        wrongFlash: 0
    });
}

function fireBullet(targetX, targetY) {
    bullets.push({
        x: gun.x,
        y: gun.y,
        targetX: targetX,
        targetY: targetY,
        speed: 18
    });
}

function cleanChar(char) {
    return char.toLowerCase().replace(/[^a-z0-9]/g, '');
}

window.addEventListener('keydown', (e) => {
    if (!gameRunning) return;

    const key = e.key;
    if (key.length !== 1) return;

    const cleanedKey = cleanChar(key);
    if (!cleanedKey) return;

    if (!activeTarget) {
        for (let enemy of enemies) {
            for (let ans of enemy.validAnswers) {
                const firstClean = cleanChar(ans[0]);
                if (firstClean === cleanedKey) {
                    activeTarget = enemy;
                    activeTarget.currentMatchedAns = ans;
                    break;
                }
            }
            if (activeTarget) break;
        }
    }

    if (activeTarget) {
        let possibleAnswers = activeTarget.validAnswers;
        let testTyped = activeTarget.userTyped + cleanedKey;
        
        let matchingAns = possibleAnswers.find(ans => {
            let cleanAns = ans.split('').map(cleanChar).join('');
            return cleanAns.startsWith(testTyped);
        });

        if (matchingAns) {
            activeTarget.userTyped = testTyped;
            activeTarget.currentMatchedAns = matchingAns;

            fireBullet(activeTarget.x + activeTarget.userTyped.length * 9, activeTarget.y);

            let cleanAns = matchingAns.split('').map(cleanChar).join('');
            
            if (activeTarget.userTyped === cleanAns) {
                score += isSentenceMode ? 30 : 10;
                scoreEl.innerText = score;
                
                speakText(matchingAns);

                enemies = enemies.filter(e => e !== activeTarget);
                activeTarget = null;
            }
        } else {
            activeTarget.wrongFlash = 10;
        }
    }
});

function update() {
    if (!gameRunning) return;

    for (let enemy of enemies) {
        enemy.y += enemy.speed;
        if (enemy.wrongFlash > 0) enemy.wrongFlash--;

        if (enemy.y > canvas.height - 40) {
            if (enemy === activeTarget) activeTarget = null;
            enemies = enemies.filter(e => e !== enemy);
        }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        let dx = b.targetX - b.x;
        let dy = b.targetY - b.y;
        let dist = Math.hypot(dx, dy);

        if (dist < 12) {
            bullets.splice(i, 1);
        } else {
            b.x += (dx / dist) * b.speed;
            b.y += (dy / dist) * b.speed;
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameRunning) return;

    // Vẽ súng
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(gun.x, gun.y, 22, 0, Math.PI * 2);
    ctx.fill();

    // Vẽ kẻ địch / câu
    for (let enemy of enemies) {
        const isSelected = (enemy === activeTarget);
        const targetText = enemy.currentMatchedAns || enemy.validAnswers[0];

        // 1. Tiếng Việt
        ctx.font = 'bold 15px Arial';
        ctx.fillStyle = enemy.wrongFlash > 0 ? '#ef4444' : (isSelected ? '#fde047' : '#e2e8f0');
        ctx.fillText(`🇻🇳 ${enemy.meaning}`, enemy.x, enemy.y - 22);

        // 2. Gợi ý xáo trộn
        ctx.font = 'italic 13px Arial';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(`[Gợi ý: ${enemy.hint}]`, enemy.x, enemy.y - 6);

        // 3. Chuỗi Tiếng Anh
        ctx.font = 'bold 18px Courier New';
        
        let typedCount = enemy.userTyped.length;
        let charIndex = 0;
        let cleanFound = 0;

        while (charIndex < targetText.length && cleanFound < typedCount) {
            if (cleanChar(targetText[charIndex]) !== '') {
                cleanFound++;
            }
            charIndex++;
        }

        let typedDisplay = targetText.substring(0, charIndex);
        let remainingText = targetText.substring(charIndex);

        ctx.fillStyle = '#4ade80';
        ctx.fillText(typedDisplay, enemy.x, enemy.y + 16);

        let typedWidth = ctx.measureText(typedDisplay).width;
        let hiddenPlaceholder = remainingText.replace(/[a-zA-Z0-9]/g, '_');

        ctx.fillStyle = isSelected ? '#38bdf8' : '#475569';
        ctx.fillText(hiddenPlaceholder, enemy.x + typedWidth, enemy.y + 16);
    }

    // Vẽ đạn
    ctx.fillStyle = '#f43f5e';
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
</script>
