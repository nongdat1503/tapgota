<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Game Bắn Từ Vựng - Typing Shooter</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameCanvas {
            border: 2px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            background: #020617;
        }
        .info {
            position: absolute;
            top: 20px;
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="info">Điểm: <span id="score">0</span></div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

// Danh sách từ vựng kèm nghĩa tiếng Việt
const wordList = [
    { en: 'apple', vi: 'Thịt / Quả táo' },
    { en: 'banana', vi: 'Quả chuối' },
    { en: 'computer', vi: 'Máy tính' },
    { en: 'keyboard', vi: 'Bàn phím' },
    { en: 'coding', vi: 'Lập trình' },
    { en: 'english', vi: 'Tiếng Anh' },
    { en: 'rocket', vi: 'Tên lửa' },
    { en: 'bullet', vi: 'Viên đạn' },
    { en: 'galaxy', vi: 'Thiên hà' },
    { en: 'future', vi: 'Tương lai' }
];

let score = 0;
let enemies = [];
let bullets = [];
let activeTarget = null; // Từ đang gõ dở

// Tọa độ súng
const gun = { x: canvas.width / 2, y: canvas.height - 30 };

// Tạo từ mới rơi xuống
function spawnEnemy() {
    const wordObj = wordList[Math.floor(Math.random() * wordList.length)];
    const x = Math.random() * (canvas.width - 200) + 50;
    enemies.push({
        text: wordObj.en,
        meaning: wordObj.vi,
        typedIndex: 0,
        x: x,
        y: 0,
        speed: 0.8 + Math.random() * 0.5
    });
}

// Tạo hiệu ứng đạn
function fireBullet(targetX, targetY) {
    bullets.push({
        x: gun.x,
        y: gun.y,
        targetX: targetX,
        targetY: targetY,
        speed: 14
    });
}

// Xử lý gõ phím
window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (key.length !== 1 || key < 'a' || key > 'z') return;

    // Tìm mục tiêu nếu chưa chọn
    if (!activeTarget) {
        for (let enemy of enemies) {
            if (enemy.text[0] === key) {
                activeTarget = enemy;
                break;
            }
        }
    }

    // Kiểm tra gõ đúng phím tiếp theo
    if (activeTarget) {
        if (activeTarget.text[activeTarget.typedIndex] === key) {
            activeTarget.typedIndex++;
            fireBullet(activeTarget.x + activeTarget.typedIndex * 12, activeTarget.y);

            // Gõ xong toàn bộ từ
            if (activeTarget.typedIndex === activeTarget.text.length) {
                score += 10;
                scoreEl.innerText = score;
                enemies = enemies.filter(e => e !== activeTarget);
                activeTarget = null;
            }
        }
    }
});

function update() {
    // Cập nhật vị trí từ rơi
    for (let enemy of enemies) {
        enemy.y += enemy.speed;
        if (enemy.y > canvas.height - 40) {
            if (enemy === activeTarget) activeTarget = null;
            enemies = enemies.filter(e => e !== enemy);
        }
    }

    // Cập nhật đạn
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        let dx = b.targetX - b.x;
        let dy = b.targetY - b.y;
        let dist = Math.hypot(dx, dy);

        if (dist < 10) {
            bullets.splice(i, 1);
        } else {
            b.x += (dx / dist) * b.speed;
            b.y += (dy / dist) * b.speed;
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Vẽ súng
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(gun.x, gun.y, 20, 0, Math.PI * 2);
    ctx.fill();

    // Vẽ từ vựng & Tiếng Việt
    for (let enemy of enemies) {
        // 1. Vẽ nghĩa tiếng Việt bên trên (phông nhỏ, mờ hơn)
        ctx.font = '14px Arial';
        ctx.fillStyle = enemy === activeTarget ? '#fde047' : '#94a3b8';
        ctx.fillText(`(${enemy.meaning})`, enemy.x, enemy.y - 22);

        // 2. Vẽ từ tiếng Anh
        ctx.font = '22px Courier New';
        let typedPart = enemy.text.substring(0, enemy.typedIndex);
        let remainingPart = enemy.text.substring(enemy.typedIndex);

        // Chữ đã gõ (Xanh lá)
        ctx.fillStyle = '#4ade80';
        ctx.fillText(typedPart, enemy.x, enemy.y);

        // Chữ chưa gõ (Trắng hoặc Vàng nếu đang ngắm)
        let typedWidth = ctx.measureText(typedPart).width;
        ctx.fillStyle = enemy === activeTarget ? '#facc15' : '#ffffff';
        ctx.fillText(remainingPart, enemy.x + typedWidth, enemy.y);
    }

    // Vẽ đạn
    ctx.fillStyle = '#f43f5e';
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

setInterval(spawnEnemy, 2500);
gameLoop();
</script>
</body>
</html>
