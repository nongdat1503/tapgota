<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Game Bắn Từ Vựng - Typing Shooter</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
        }

        #gameCanvas {
            border: 2px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            background: #020617;
            display: block;
        }

        .info {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            z-index: 5;
            pointer-events: none;
        }

        .info button {
            pointer-events: auto;
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .info button:hover {
            background: #0369a1;
        }

        /* Menu chọn chủ đề overlay */
        #menuOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
        }

        #menuOverlay h1 {
            color: #38bdf8;
            margin: 0 0 5px 0;
            font-size: 32px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #menuOverlay p {
            color: #94a3b8;
            margin: 0 0 25px 0;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 90%;
            max-width: 650px;
        }

        .category-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.2s ease;
            text-align: center;
        }

        .category-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .category-btn.all-btn {
            grid-column: span 3;
            background: #0284c7;
            border-color: #38bdf8;
        }

        .category-btn.all-btn:hover {
            background: #0369a1;
            color: white;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="info">
        <div>Điểm: <span id="score" style="color: #4ade80; font-weight: bold;">0</span></div>
        <div>Chủ đề: <span id="currentCategory" style="color: #fde047;">Tất cả</span></div>
        <button id="changeCatBtn" onclick="showMenu()">Đổi chủ đề</button>
    </div>

    <!-- Màn hình chọn chủ đề -->
    <div id="menuOverlay">
        <h1>Bắn Từ Vựng</h1>
        <p>Chọn một chủ đề để bắt đầu luyện tập</p>
        <div class="category-grid" id="categoryGrid"></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
const vocabularyCategories = {
    'Thực phẩm': [
        { en: 'apple', vi: 'Quả táo' }, { en: 'banana', vi: 'Quả chuối' }, { en: 'water', vi: 'Nước' },
        { en: 'food', vi: 'Thức ăn' }, { en: 'bread', vi: 'Bánh mì' }, { en: 'rice', vi: 'Cơm / Gạo' },
        { en: 'milk', vi: 'Sữa' }, { en: 'tea', vi: 'Trà' }, { en: 'coffee', vi: 'Cà phê' },
        { en: 'meat', vi: 'Thịt' }, { en: 'fish', vi: 'Cá' }, { en: 'chicken', vi: 'Thịt gà' },
        { en: 'egg', vi: 'Quả trứng' }, { en: 'sugar', vi: 'Đường' }, { en: 'salt', vi: 'Muối' },
        { en: 'fruit', vi: 'Trái cây' }, { en: 'vegetable', vi: 'Rau củ' }, { en: 'soup', vi: 'Canh / Súp' },
        { en: 'juice', vi: 'Nước ép' }, { en: 'cake', vi: 'Bánh ngọt' }
    ],
    'Công nghệ': [
        { en: 'computer', vi: 'Máy tính' }, { en: 'keyboard', vi: 'Bàn phím' }, { en: 'mouse', vi: 'Con chuột' },
        { en: 'screen', vi: 'Màn hình' }, { en: 'phone', vi: 'Điện thoại' }, { en: 'laptop', vi: 'Laptop' },
        { en: 'internet', vi: 'Mạng internet' }, { en: 'website', vi: 'Trang web' }, { en: 'software', vi: 'Phần mềm' },
        { en: 'hardware', vi: 'Phần cứng' }, { en: 'network', vi: 'Mạng lưới' }, { en: 'data', vi: 'Dữ liệu' },
        { en: 'coding', vi: 'Lập trình' }, { en: 'system', vi: 'Hệ thống' }, { en: 'device', vi: 'Thiết bị' },
        { en: 'camera', vi: 'Máy ảnh' }, { en: 'file', vi: 'Tập tin' }, { en: 'folder', vi: 'Thư mục' },
        { en: 'message', vi: 'Tin nhắn' }, { en: 'email', vi: 'Thư điện tử' }
    ],
    'Gia đình & Con người': [
        { en: 'family', vi: 'Gia đình' }, { en: 'father', vi: 'Bố / Cha' }, { en: 'mother', vi: 'Mẹ' },
        { en: 'brother', vi: 'Anh / Em trai' }, { en: 'sister', vi: 'Chị / Em gái' }, { en: 'child', vi: 'Đứa trẻ' },
        { en: 'children', vi: 'Trẻ em' }, { en: 'parent', vi: 'Phụ huynh' }, { en: 'friend', vi: 'Bạn bè' },
        { en: 'person', vi: 'Con người' }, { en: 'people', vi: 'Mọi người' }, { en: 'man', vi: 'Đàn ông' },
        { en: 'woman', vi: 'Phụ nữ' }, { en: 'boy', vi: 'Cậu bé' }, { en: 'girl', vi: 'Cô gái' },
        { en: 'baby', vi: 'Trẻ sơ sinh' }, { en: 'student', vi: 'Học sinh' }, { en: 'teacher', vi: 'Giáo viên' },
        { en: 'doctor', vi: 'Bác sĩ' }, { en: 'worker', vi: 'Người lao động' }
    ],
    'Thời gian & Vũ trụ': [
        { en: 'time', vi: 'Thời gian' }, { en: 'today', vi: 'Hôm nay' }, { en: 'yesterday', vi: 'Hôm qua' },
        { en: 'tomorrow', vi: 'Ngày mai' }, { en: 'morning', vi: 'Buổi sáng' }, { en: 'afternoon', vi: 'Buổi chiều' },
        { en: 'evening', vi: 'Buổi tối' }, { en: 'night', vi: 'Ban đêm' }, { en: 'week', vi: 'Tuần' },
        { en: 'month', vi: 'Tháng' }, { en: 'year', vi: 'Năm' }, { en: 'future', vi: 'Tương lai' },
        { en: 'past', vi: 'Quá khứ' }, { en: 'present', vi: 'Hiện tại' }, { en: 'sun', vi: 'Mặt trời' },
        { en: 'moon', vi: 'Mặt trăng' }, { en: 'star', vi: 'Ngôi sao' }, { en: 'galaxy', vi: 'Thiên hà' },
        { en: 'space', vi: 'Vũ trụ' }, { en: 'earth', vi: 'Trái đất' }
    ],
    'Đồ vật & Nhà cửa': [
        { en: 'house', vi: 'Ngôi nhà' }, { en: 'room', vi: 'Căn phòng' }, { en: 'door', vi: 'Cửa ra vào' },
        { en: 'window', vi: 'Cửa sổ' }, { en: 'table', vi: 'Cái bàn' }, { en: 'chair', vi: 'Cái ghế' },
        { en: 'bed', vi: 'Cái giường' }, { en: 'book', vi: 'Quyển sách' }, { en: 'pen', vi: 'Cây bút' },
        { en: 'paper', vi: 'Tờ giấy' }, { en: 'bag', vi: 'Túi xách' }, { en: 'clothes', vi: 'Quần áo' },
        { en: 'shoes', vi: 'Giày' }, { en: 'clock', vi: 'Đồng hồ' }, { en: 'money', vi: 'Tiền' },
        { en: 'car', vi: 'Xe hơi' }, { en: 'bicycle', vi: 'Xe đạp' }, { en: 'bus', vi: 'Xe buýt' },
        { en: 'train', vi: 'Tàu hỏa' }, { en: 'airplane', vi: 'Máy bay' }
    ],
    'Động từ thông dụng': [
        { en: 'have', vi: 'Có' }, { en: 'do', vi: 'Làm' }, { en: 'say', vi: 'Nói' }, { en: 'go', vi: 'Đi' },
        { en: 'get', vi: 'Nhận được' }, { en: 'make', vi: 'Tạo ra' }, { en: 'know', vi: 'Biết' },
        { en: 'think', vi: 'Nghĩ' }, { en: 'take', vi: 'Cầm / Lấy' }, { en: 'see', vi: 'Nhìn thấy' },
        { en: 'come', vi: 'Đến' }, { en: 'want', vi: 'Muốn' }, { en: 'look', vi: 'Nhìn' },
        { en: 'use', vi: 'Sử dụng' }, { en: 'find', vi: 'Tìm kiếm' }, { en: 'give', vi: 'Cho / Tặng' },
        { en: 'tell', vi: 'Kể / Nói' }, { en: 'work', vi: 'Làm việc' }, { en: 'call', vi: 'Gọi' },
        { en: 'play', vi: 'Chơi' }
    ]
};

let canvas, ctx, scoreEl, categoryEl, menuOverlay, categoryGrid;
let activeWordList = [];
let score = 0;
let enemies = [];
let bullets = [];
let activeTarget = null;
let gameRunning = false;
let spawnInterval = null;
let gun = { x: 400, y: 570 };

document.addEventListener('DOMContentLoaded', () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    scoreEl = document.getElementById('score');
    categoryEl = document.getElementById('currentCategory');
    menuOverlay = document.getElementById('menuOverlay');
    categoryGrid = document.getElementById('categoryGrid');
    gun = { x: canvas.width / 2, y: canvas.height - 30 };

    initMenu();
    gameLoop();
});

function initMenu() {
    categoryGrid.innerHTML = '';
    
    // Nút chọn tất cả chủ đề
    const allBtn = document.createElement('button');
    allBtn.className = 'category-btn all-btn';
    allBtn.innerText = '🌟 Tất cả chủ đề';
    allBtn.onclick = () => startGame('Tất cả');
    categoryGrid.appendChild(allBtn);

    // Tạo nút cho từng chủ đề
    Object.keys(vocabularyCategories).forEach(catName => {
        const btn = document.createElement('button');
        btn.className = 'category-btn';
        btn.innerText = catName;
        btn.onclick = () => startGame(catName);
        categoryGrid.appendChild(btn);
    });
}

function showMenu() {
    gameRunning = false;
    clearInterval(spawnInterval);
    enemies = [];
    bullets = [];
    activeTarget = null;
    menuOverlay.style.display = 'flex';
}

function startGame(category) {
    categoryEl.innerText = category;
    
    if (category === 'Tất cả') {
        activeWordList = Object.values(vocabularyCategories).flat();
    } else {
        activeWordList = vocabularyCategories[category];
    }

    score = 0;
    scoreEl.innerText = score;
    enemies = [];
    bullets = [];
    activeTarget = null;
    
    menuOverlay.style.display = 'none';
    gameRunning = true;
    
    clearInterval(spawnInterval);
    spawnInterval = setInterval(spawnEnemy, 2500);
}

function spawnEnemy() {
    if (!gameRunning || activeWordList.length === 0) return;

    const wordObj = activeWordList[Math.floor(Math.random() * activeWordList.length)];
    const x = Math.random() * (canvas.width - 200) + 50;
    enemies.push({
        text: wordObj.en,
        meaning: wordObj.vi,
        typedIndex: 0,
        x: x,
        y: 0,
        speed: 0.8 + Math.random() * 0.5
    });
}

function fireBullet(targetX, targetY) {
    bullets.push({
        x: gun.x,
        y: gun.y,
        targetX: targetX,
        targetY: targetY,
        speed: 14
    });
}

window.addEventListener('keydown', (e) => {
    if (!gameRunning) return;

    const key = e.key.toLowerCase();
    if (key.length !== 1 || key < 'a' || key > 'z') return;

    if (!activeTarget) {
        for (let enemy of enemies) {
            if (enemy.text[0] === key) {
                activeTarget = enemy;
                break;
            }
        }
    }

    if (activeTarget) {
        if (activeTarget.text[activeTarget.typedIndex] === key) {
            activeTarget.typedIndex++;
            fireBullet(activeTarget.x + activeTarget.typedIndex * 12, activeTarget.y);

            if (activeTarget.typedIndex === activeTarget.text.length) {
                score += 10;
                scoreEl.innerText = score;
                enemies = enemies.filter(e => e !== activeTarget);
                activeTarget = null;
            }
        }
    }
});

function update() {
    if (!gameRunning) return;

    for (let enemy of enemies) {
        enemy.y += enemy.speed;
        if (enemy.y > canvas.height - 40) {
            if (enemy === activeTarget) activeTarget = null;
            enemies = enemies.filter(e => e !== enemy);
        }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        let dx = b.targetX - b.x;
        let dy = b.targetY - b.y;
        let dist = Math.hypot(dx, dy);

        if (dist < 10) {
            bullets.splice(i, 1);
        } else {
            b.x += (dx / dist) * b.speed;
            b.y += (dy / dist) * b.speed;
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!gameRunning) return;

    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.arc(gun.x, gun.y, 20, 0, Math.PI * 2);
    ctx.fill();

    for (let enemy of enemies) {
        ctx.font = '14px Arial';
        ctx.fillStyle = enemy === activeTarget ? '#fde047' : '#94a3b8';
        ctx.fillText(`(${enemy.meaning})`, enemy.x, enemy.y - 22);

        ctx.font = '22px Courier New';
        let typedPart = enemy.text.substring(0, enemy.typedIndex);
        let remainingPart = enemy.text.substring(enemy.typedIndex);

        ctx.fillStyle = '#4ade80';
        ctx.fillText(typedPart, enemy.x, enemy.y);

        let typedWidth = ctx.measureText(typedPart).width;
        ctx.fillStyle = enemy === activeTarget ? '#facc15' : '#ffffff';
        ctx.fillText(remainingPart, enemy.x + typedWidth, enemy.y);
    }

    ctx.fillStyle = '#f43f5e';
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
